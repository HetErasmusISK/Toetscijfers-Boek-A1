<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toetscijfers - ISK</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Fredoka', sans-serif; }
  </style>
</head>
<body class="bg-gray-100">
  <div id="app"></div>

  <script>
    // Firebase init
    const firebaseConfig = {
      apiKey: "AIzaSyAU0_2AYUBuDnOZdwCxZB9biVt2Mdbei9E",
      authDomain: "toetsinvoer-taalcompleet-a1.firebaseapp.com",
      projectId: "toetsinvoer-taalcompleet-a1",
      storageBucket: "toetsinvoer-taalcompleet-a1.firebasestorage.app",
      messagingSenderId: "557006079169",
      appId: "1:557006079169:web:fcf30ba5152318b6e28040"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // App state
    let isLoggedIn = false;
    let students = [];
    let grades = {};
    const themes = ['Thema 1', 'Thema 2', 'Thema 3', 'Thema 4', 'Thema 5', 'Thema 6', 'Thema 7', 'Thema 8'];

    // Load from Firebase
    async function loadData() {
      try {
        console.log('Loading from Firebase...');
        const doc = await db.collection('toetscijfers').doc('data').get();
        if (doc.exists) {
          const data = doc.data();
          students = data.students || [];
          grades = data.grades || {};
          console.log('✅ Data loaded:', students.length, 'students');
        } else {
          console.log('No document found');
        }
      } catch (error) {
        console.error('❌ ERROR:', error.code, error.message);
        alert('Firebase error: ' + error.message);
      }
      render();
    }

    // Save to Firebase
    async function saveData() {
      try {
        await db.collection('toetscijfers').doc('data').set({ students, grades });
        console.log('✅ Saved');
      } catch (error) {
        console.error('Save error:', error.message);
      }
    }

    function login(pwd) {
      if (pwd === 'ISK2026!') {
        isLoggedIn = true;
        loadData();
      } else {
        alert('Wrong password');
      }
    }

    function addStudent(name) {
      if (students.length >= 18) return;
      students.push({ id: Date.now(), name });
      students.sort((a, b) => a.name.localeCompare(b.name, 'nl'));
      saveData();
      render();
    }

    function removeStudent(id) {
      students = students.filter(s => s.id !== id);
      delete grades[id];
      saveData();
      render();
    }

    function setGrade(studentId, themeIdx, grade) {
      if (!grades[studentId]) grades[studentId] = {};
      grades[studentId][themeIdx] = grade ? parseFloat(grade) : null;
      saveData();
    }

    function render() {
      const app = document.getElementById('app');

      if (!isLoggedIn) {
        app.innerHTML = `
          <div class="min-h-screen bg-blue-500 flex items-center justify-center">
            <form onsubmit="login(document.getElementById('pwd').value); return false;" class="bg-white p-8 rounded-lg shadow-lg">
              <h1 class="text-2xl font-bold mb-4">Toetscijfers</h1>
              <input id="pwd" type="password" placeholder="Password" class="w-full px-4 py-2 border rounded mb-4" autofocus>
              <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded font-bold">Login</button>
            </form>
          </div>
        `;
        return;
      }

      let html = `
        <div class="p-4 max-w-7xl mx-auto">
          <h1 class="text-3xl font-bold mb-4">Toetscijfers ISK</h1>
          
          <div class="bg-white p-4 rounded mb-4">
            <input id="newName" type="text" placeholder="Naam..." class="w-64 px-3 py-2 border rounded">
            <button onclick="addStudent(document.getElementById('newName').value); document.getElementById('newName').value='';" class="bg-green-500 text-white px-4 py-2 rounded ml-2">+</button>
            <span class="ml-4 text-gray-600">${students.length}/18</span>
          </div>

          <div class="bg-white rounded overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="bg-blue-600 text-white">
                <tr>
                  <th class="px-4 py-2 text-left">Leerling</th>
                  ${themes.map(t => `<th class="px-2 py-2 text-center">${t}</th>`).join('')}
                  <th class="px-4 py-2">Acties</th>
                </tr>
              </thead>
              <tbody>
      `;

      students.forEach(student => {
        html += `<tr class="border-b hover:bg-gray-50">
          <td class="px-4 py-2 font-medium">${student.name}</td>
        `;
        
        themes.forEach((_, idx) => {
          const val = grades[student.id]?.[idx] || '';
          html += `
            <td class="px-2 py-2 text-center">
              <input type="number" value="${val}" onchange="setGrade(${student.id}, ${idx}, this.value)" 
                     class="w-16 px-2 py-1 border rounded text-center" min="1" max="10" step="0.1">
            </td>
          `;
        });

        html += `
          <td class="px-4 py-2">
            <button onclick="removeStudent(${student.id})" class="bg-red-500 text-white px-3 py-1 rounded">X</button>
          </td>
        </tr>`;
      });

      html += `
              </tbody>
            </table>
          </div>
        </div>
      `;

      app.innerHTML = html;
    }

    render();
  </script>
</body>
</html>
