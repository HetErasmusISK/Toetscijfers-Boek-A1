<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toetscijfers Invoer - ISK Almelo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * { font-family: 'Fredoka', sans-serif; }
    .mono { font-family: 'Courier New', monospace; }
    .grade-input { transition: all 0.3s ease; }
    .grade-input:focus { transform: scale(1.05); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }
    .header-accent { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .card-shadow { box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.1), 0 2px 4px -1px rgba(99, 102, 241, 0.06); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    // ============================================
    // FIREBASE CONFIGURATIE
    // ============================================
    const firebaseConfig = {
      apiKey: "AIzaSyAU0_2AYUBuDnOZdwCxZB9biVt2Mdbei9E",
      authDomain: "toetsinvoer-taalcompleet-a1.firebaseapp.com",
      projectId: "toetsinvoer-taalcompleet-a1",
      storageBucket: "toetsinvoer-taalcompleet-a1.firebasestorage.app",
      messagingSenderId: "557006079169",
      appId: "1:557006079169:web:fcf30ba5152318b6e28040"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const APP_PASSWORD = 'ISK2026!';

    // ============================================
    // GLOBALE STAAT
    // ============================================
    let state = {
      isAuthenticated: false,
      students: [],
      grades: {},
      themes: Array.from({ length: 8 }, (_, i) => `Thema ${i + 1}`)
    };

    // ============================================
    // FIRESTORE FUNCTIES
    // ============================================
    function loadDataFromFirebase() {
      db.collection('toetscijfers').doc('data').onSnapshot((doc) => {
        if (doc.exists) {
          const data = doc.data();
          state.students = data.students || [];
          state.grades = data.grades || {};
        } else {
          db.collection('toetscijfers').doc('data').set({
            students: [],
            grades: {}
          });
        }
        render();
      }, (error) => {
        console.error('Firebase error:', error);
        alert('Fout bij het laden van Firebase. Check console.');
      });
    }

    function saveToFirebase() {
      db.collection('toetscijfers').doc('data').set({
        students: state.students,
        grades: state.grades
      }).catch(error => {
        console.error('Error saving:', error);
        alert('Fout bij opslaan naar Firebase');
      });
    }

    // ============================================
    // EVENT HANDLERS
    // ============================================
    function handleLogin(e) {
      e.preventDefault();
      const password = document.getElementById('passwordInput').value;
      if (password === APP_PASSWORD) {
        state.isAuthenticated = true;
        sessionStorage.setItem('isAuthenticated', 'true');
        loadDataFromFirebase();
        render();
      } else {
        alert('Onjuist wachtwoord');
      }
    }

    function addStudent() {
      const input = document.getElementById('newStudentInput');
      const name = input.value.trim();
      if (!name || state.students.length >= 18) return;

      state.students.push({ id: Date.now(), name });
      state.students.sort((a, b) => a.name.localeCompare(b.name, 'nl'));
      input.value = '';
      saveToFirebase();
      render();
    }

    function removeStudent(studentId) {
      if (!confirm('Leerling verwijderen?')) return;
      state.students = state.students.filter(s => s.id !== studentId);
      delete state.grades[studentId];
      saveToFirebase();
      render();
    }

    function updateGrade(studentId, themeIdx, value) {
      const grade = value === '' ? null : parseFloat(value);
      if (grade !== null && (grade < 1 || grade > 10)) return;

      const today = new Date();
      const dateStr = `${String(today.getDate()).padStart(2, '0')}-${String(today.getMonth() + 1).padStart(2, '0')}-${today.getFullYear()}`;

      if (!state.grades[studentId]) state.grades[studentId] = {};
      state.grades[studentId][themeIdx] = grade !== null ? { grade, date: dateStr } : null;

      saveToFirebase();
    }

    function calculateAverage(studentId, period) {
      const studentGrades = state.grades[studentId];
      if (!studentGrades) return null;

      const validGrades = Object.entries(studentGrades)
        .filter(([_, data]) => data && data.grade)
        .filter(([_, data]) => {
          const [day, month, year] = data.date.split('-').map(Number);
          if (period === 1) return month >= 9 || month <= 1;
          return month >= 2 && month <= 8;
        })
        .map(([_, data]) => data.grade);

      if (validGrades.length === 0) return null;
      const avg = validGrades.reduce((a, b) => a + b, 0) / validGrades.length;
      return avg.toFixed(1);
    }

    function exportData() {
      const data = JSON.stringify({ students: state.students, grades: state.grades }, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `toetscijfers-${new Date().toISOString().split('T')[0]}.json`;
      a.click();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          state.students = imported.students.sort((a, b) => a.name.localeCompare(b.name, 'nl'));
          state.grades = imported.grades;
          saveToFirebase();
          alert('Data geïmporteerd!');
        } catch (error) {
          alert('Fout bij importeren');
        }
      };
      reader.readAsText(file);
    }

    function importNames() {
      const input = prompt('Plak namen (elke naam op een nieuwe regel):');
      if (!input) return;
      const names = input.split('\n').map(n => n.trim()).filter(n => n);
      names.forEach(name => {
        if (!state.students.some(s => s.name === name)) {
          state.students.push({ id: Date.now() + Math.random(), name });
        }
      });
      state.students.sort((a, b) => a.name.localeCompare(b.name, 'nl'));
      saveToFirebase();
      render();
    }

    // ============================================
    // RENDER FUNCTIES
    // ============================================
    function renderLoginScreen() {
      return `
        <div class="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-purple-50 flex items-center justify-center p-4">
          <div class="bg-white p-8 rounded-2xl card-shadow max-w-md w-full">
            <h1 class="text-3xl font-bold text-center mb-6 header-accent">
              Toetscijfers Invoer
            </h1>
            <form onsubmit="handleLogin(event)" class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Wachtwoord</label>
                <input id="passwordInput" type="password" placeholder="Voer wachtwoord in" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" autofocus />
              </div>
              <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-2 px-4 rounded-lg hover:from-indigo-700 hover:to-purple-700 font-medium">
                Inloggen
              </button>
            </form>
          </div>
        </div>
      `;
    }

    function renderApp() {
      let html = `
        <div class="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-purple-50 p-6">
          <div class="max-w-7xl mx-auto">
            <div class="bg-white rounded-2xl card-shadow p-6 mb-6">
              <h1 class="text-4xl font-bold mb-2 header-accent">Toetscijfers Boek A1</h1>
              <p class="text-gray-600">ISK Het Erasmus - Almelo</p>
            </div>

            <div class="bg-white rounded-2xl card-shadow p-6 mb-6">
              <div class="flex flex-wrap gap-3 mb-4">
                <button onclick="importNames()" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">➕ Namen</button>
                <label class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600 cursor-pointer">
                  ⬆️ Import
                  <input type="file" accept=".json" onchange="importData(event)" class="hidden" />
                </label>
                <button onclick="exportData()" class="bg-purple-500 text-white px-4 py-2 rounded-lg hover:bg-purple-600">⬇️ Export</button>
              </div>
              <div class="flex gap-2">
                <input id="newStudentInput" type="text" placeholder="Naam..." class="flex-1 px-4 py-2 border border-gray-300 rounded-lg" maxlength="50" />
                <button onclick="addStudent()" ${state.students.length >= 18 ? 'disabled' : ''} class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 disabled:bg-gray-400">Toevoegen</button>
              </div>
              <p class="text-sm text-gray-500 mt-2">${state.students.length}/18 leerlingen</p>
            </div>

            <div class="bg-white rounded-2xl card-shadow overflow-x-auto">
              <table class="w-full min-w-max">
                <thead class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white">
                  <tr>
                    <th class="px-6 py-4 text-left font-semibold sticky left-0 bg-gradient-to-r from-indigo-600 to-purple-600">Leerling</th>
      `;

      // Thema headers
      state.themes.forEach(theme => {
        html += `<th class="px-4 py-4 text-center font-semibold">${theme}</th>`;
      });

      html += `
                    <th class="px-4 py-4 text-center font-semibold bg-indigo-700">P1/2</th>
                    <th class="px-4 py-4 text-center font-semibold bg-purple-700">P3/4</th>
                    <th class="px-4 py-4 text-center font-semibold">Acties</th>
                  </tr>
                </thead>
                <tbody>
      `;

      // Student rows
      state.students.forEach((student, sIdx) => {
        html += `
          <tr class="border-b border-gray-100 hover:bg-indigo-50">
            <td class="px-6 py-3 font-medium sticky left-0 bg-white">${student.name}</td>
        `;

        // Grade inputs
        state.themes.forEach((_, tIdx) => {
          const gradeData = state.grades[student.id]?.[tIdx];
          html += `<td class="px-4 py-3 text-center">
            <input type="number" min="1" max="10" step="0.1" value="${gradeData?.grade || ''}" onchange="updateGrade(${student.id}, ${tIdx}, this.value)" class="grade-input w-20 px-3 py-2 text-center border border-gray-300 rounded-lg mono" placeholder="-" />
          </td>`;
        });

        const p1 = calculateAverage(student.id, 1);
        const p2 = calculateAverage(student.id, 2);

        html += `
            <td class="px-4 py-3 text-center bg-indigo-50">
              <span class="inline-block px-3 py-1 bg-indigo-100 text-indigo-800 rounded-full font-semibold mono">${p1 || '-'}</span>
            </td>
            <td class="px-4 py-3 text-center bg-purple-50">
              <span class="inline-block px-3 py-1 bg-purple-100 text-purple-800 rounded-full font-semibold mono">${p2 || '-'}</span>
            </td>
            <td class="px-4 py-3 text-center">
              <button onclick="removeStudent(${student.id})" class="text-red-500 hover:text-red-700 px-2">🗑️</button>
            </td>
          </tr>
        `;
      });

      html += `
                </tbody>
              </table>
            </div>

            <div class="mt-6 text-center text-sm text-gray-500">
              <p>ISK Het Erasmus - Toetscijfers 2026</p>
              <p>Firebase Real-time Sync ✅</p>
            </div>
          </div>
        </div>
      `;
      return html;
    }

    function render() {
      const root = document.getElementById('root');
      root.innerHTML = state.isAuthenticated ? renderApp() : renderLoginScreen();
    }

    // ============================================
    // INIT
    // ============================================
    window.addEventListener('DOMContentLoaded', () => {
      const authStatus = sessionStorage.getItem('isAuthenticated');
      if (authStatus === 'true') {
        state.isAuthenticated = true;
        loadDataFromFirebase();
      } else {
        render();
      }
    });
  </script>
</body>
</html>
