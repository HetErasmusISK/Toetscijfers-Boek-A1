<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toetscijfers - DEBUG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Fredoka', sans-serif; }
    pre { background: #f0f0f0; padding: 10px; border-radius: 5px; overflow-x: auto; font-size: 12px; }
  </style>
</head>
<body class="bg-gray-100 p-4">
  <div id="app"></div>

  <script>
    // Firebase init
    const firebaseConfig = {
      apiKey: "AIzaSyAU0_2AYUBuDnOZdwCxZB9biVt2Mdbei9E",
      authDomain: "toetsinvoer-taalcompleet-a1.firebaseapp.com",
      projectId: "toetsinvoer-taalcompleet-a1",
      storageBucket: "toetsinvoer-taalcompleet-a1.firebasestorage.app",
      messagingSenderId: "557006079169",
      appId: "1:557006079169:web:fcf30ba5152318b6e28040"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let debugInfo = '';
    let students = [];
    let grades = {};

    async function loadData() {
      try {
        debugInfo += '🔄 Firebase connectie...\n';

        // Haal toetscijfers/data op
        debugInfo += '💾 Laden toetscijfers/data:\n';
        const doc = await db.collection('toetscijfers').doc('data').get();
        
        if (doc.exists) {
          const rawData = doc.data();
          debugInfo += '✅ Document bestaat!\n';
          debugInfo += '\n📦 RAW Data:\n' + JSON.stringify(rawData, null, 2) + '\n';
          
          // Check velden
          debugInfo += '\n🔍 Veld controle:\n';
          debugInfo += `  - students type: ${typeof rawData.students}\n`;
          debugInfo += `  - students is array: ${Array.isArray(rawData.students)}\n`;
          debugInfo += `  - students length: ${Array.isArray(rawData.students) ? rawData.students.length : 'N/A'}\n`;
          debugInfo += `  - grades type: ${typeof rawData.grades}\n`;
          
          if (Array.isArray(rawData.students)) {
            students = rawData.students;
            debugInfo += `\n✅ ${students.length} leerlingen geladen!\n`;
            debugInfo += '\n👥 Leerlingen:\n';
            students.forEach((s, i) => {
              debugInfo += `  ${i+1}. ${s.name || s.naam || s.N || '(geen naam)'} (id: ${s.id})\n`;
            });
          } else {
            debugInfo += '\n⚠️ "students" is geen array!\n';
          }

          if (typeof rawData.grades === 'object' && rawData.grades !== null) {
            grades = rawData.grades;
          }
        } else {
          debugInfo += '❌ Document NIET gevonden!\n';
        }

      } catch (error) {
        debugInfo += `\n❌ FOUT: ${error.code}\n${error.message}\n`;
      }

      render();
    }

    function render() {
      const app = document.getElementById('app');
      
      app.innerHTML = `
        <div class="max-w-2xl mx-auto">
          <h1 class="text-3xl font-bold mb-4">🔧 DEBUG MODE</h1>
          
          <div class="bg-white p-4 rounded-lg shadow mb-4">
            <h2 class="text-xl font-bold mb-2">Firebase Diagnose:</h2>
            <pre>${debugInfo}</pre>
          </div>

          <div class="bg-white p-4 rounded-lg shadow">
            <h2 class="text-xl font-bold mb-2">Geladen leerlingen (${students.length}):</h2>
            ${students.length > 0 ? `
              <ul class="space-y-2">
                ${students.map((s, i) => `
                  <li class="bg-blue-50 p-2 rounded">
                    ${i+1}. <strong>${s.name || s.naam || 'GEEN NAAM'}</strong> 
                    <span class="text-gray-500 text-sm">(id: ${s.id})</span>
                  </li>
                `).join('')}
              </ul>
            ` : `
              <p class="text-red-600 font-bold">⚠️ GEEN LEERLINGEN GELADEN!</p>
            `}
          </div>

          <div class="mt-4">
            <button onclick="location.reload()" class="bg-blue-500 text-white px-4 py-2 rounded">Opnieuw laden</button>
          </div>
        </div>
      `;
    }

    // Start
    loadData();
  </script>
</body>
</html>
